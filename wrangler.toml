name = "ucc128tracker"
compatibility_date = "2026-08-28"
main = "worker/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Fill in database_id after running:
#   wrangler d1 create ucc128-tracker-db
# (see GRANULAR_SETUP_GUIDE.md, Phase 3)
[[d1_databases]]
binding = "DB"
database_name = "ucc128-tracker-db"
database_id = "5e483b49-c5e1-45c7-96d5-e1e9046834ca"

# Created via:
#   wrangler r2 bucket create ucc128-label-samples
# (see GRANULAR_SETUP_GUIDE.md, Phase 4)
[[r2_buckets]]
binding = "SAMPLES"
bucket_name = "ucc128-label-samples"
