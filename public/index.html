<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCC128 Label Rollout &mdash; Testing Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FBFBFC;
  --border:#E3E6EA; --border-strong:#CBD1D9;
  --text:#12161C; --text-2:#5B6472; --text-3:#8A93A1;
  --accent:#0D9488; --accent-dark:#0B7C72; --accent-light:#E6F6F4;
  --amber-bg:#FEF3E2; --amber-tx:#B5590C;
  --red-bg:#FDE9E7; --red-tx:#C0281A;
  --green-bg:#E4F8EC; --green-tx:#0D7A3E;
  --gray-bg:#EEF0F3; --gray-tx:#5B6472;
  --shadow-sm: 0 1px 2px rgba(16,22,28,.04);
  --shadow-md: 0 4px 16px rgba(16,22,28,.08);
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;}
.hidden{display:none !important;}
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:#0B1220;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-md);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#0BC5BE);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#08201D;flex:none;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-title{font-weight:700;font-size:14.5px;}
.brand-sub{font-size:11px;color:#9AA6B8;font-weight:500;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.btn{border:1px solid transparent;border-radius:8px;padding:7px 13px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost-dark{background:rgba(255,255,255,.06);color:#E7EBF1;border-color:rgba(255,255,255,.12);}
.btn-ghost-dark:hover{background:rgba(255,255,255,.12);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;color:var(--text);border-color:var(--border-strong);}
.btn-outline:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:7px;}
.btn[disabled]{opacity:.5;cursor:default;}
.nav-row{background:#111826;padding:0 24px;display:flex;gap:2px;position:sticky;top:60px;z-index:49;box-shadow:var(--shadow-sm);overflow-x:auto;}
.nav-tab{padding:11px 16px;font-size:13px;font-weight:600;color:#8D97A8;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;}
.nav-tab:hover{color:#D3D9E2;}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent);}
.page{padding:24px 28px 60px;max-width:2200px;margin:0 auto;width:100%;}
.page-title{font-size:21px;font-weight:800;margin:0 0 4px;}
.page-desc{font-size:13px;color:var(--text-2);margin:0;}
.banner{background:var(--amber-bg);border:1px solid #F3D9A8;color:var(--amber-tx);border-radius:10px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent-color,var(--accent));}
.kpi-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.kpi-value{font-size:30px;font-weight:800;color:var(--text);}
.kpi-value.accent{color:var(--accent);}
.kpi-value.warn{color:var(--red-tx);}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden;}
.panel-header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-size:14.5px;font-weight:700;}
.panel-body{padding:16px 18px;}
.status-row{display:flex;align-items:center;gap:12px;padding:9px 0;}
.status-row + .status-row{border-top:1px solid var(--border);}
.status-chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:100px;min-width:150px;text-align:center;}
.bar-track{flex:1;height:9px;background:var(--gray-bg);border-radius:100px;overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;background:var(--accent);}
.status-count{font-size:13px;font-weight:700;color:var(--text-2);min-width:70px;text-align:right;}
.overdue-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;}
.overdue-item + .overdue-item{border-top:1px solid var(--border);}
.overdue-meta{color:var(--text-3);font-size:12px;}
.empty-state{padding:26px 18px;text-align:center;color:var(--text-3);font-size:13px;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.tf-input,.tf-select{font-family:inherit;font-size:12.5px;border:1px solid var(--border-strong);border-radius:7px;padding:7px 10px;background:#fff;color:var(--text);outline:none;}
.tf-search{min-width:220px;flex:1;max-width:320px;}
.toolbar-spacer{flex:1;}
.result-count{font-size:12px;color:var(--text-3);font-weight:600;white-space:nowrap;}
.chips-row{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 14px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-light);color:var(--accent-dark);border:1px solid var(--accent);border-radius:100px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600;}
.chip-x{border:none;background:rgba(11,124,114,.14);color:var(--accent-dark);width:18px;height:18px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow-sm);}
table{border-collapse:collapse;width:100%;min-width:1300px;font-size:12.5px;}
thead th{position:sticky;top:0;background:#F8F9FB;z-index:2;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);padding:10px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;}
tbody td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:nth-child(even){background:#FCFCFD;}
tbody tr.row-approved td{background:#E8F8EC;}
.cell-input,.cell-select,.cell-date{width:100%;font-family:inherit;font-size:12px;border:1px solid transparent;border-radius:6px;padding:5px 7px;background:transparent;color:var(--text);outline:none;min-width:110px;}
.cell-select{min-width:168px;}
.cell-input:hover,.cell-select:hover,.cell-date:hover{border-color:var(--border-strong);background:#fff;}
.cell-input:focus,.cell-select:focus,.cell-date:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-light);}
.editable-col{background:#FCFEFD;}
.col-group-start{border-left:2px solid var(--border-strong) !important;}
.wave-unknown{background:var(--amber-bg) !important;}
.date-cell-wrap{display:flex;align-items:center;gap:2px;}
.cell-date.inherited{color:var(--text-3);}
.cell-date.overridden{color:#6D28D9;font-weight:700;background:#F3EEFF;}
.cell-date.date-conflict{border-color:var(--red-tx) !important;background:var(--red-bg);}
.reset-wave-btn{border:none;background:none;color:#6D28D9;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;line-height:1;flex:none;}
.reset-wave-btn:hover{background:#F3EEFF;}
.wave-dates-strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm);font-size:12.5px;}
.wave-dates-strip label{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.wave-date-input{font-family:inherit;font-size:12.5px;border:1px solid var(--border-strong);border-radius:7px;padding:5px 8px;}
.ovr-count{font-size:11.5px;font-weight:700;color:#6D28D9;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;}
.pill-not-started{background:var(--gray-bg);color:var(--gray-tx);}
.pill-gathering{background:var(--amber-bg);color:var(--amber-tx);}
.pill-changes{background:var(--red-bg);color:var(--red-tx);}
.pill-approved{background:var(--green-bg);color:var(--green-tx);}
.summary-table td.name-cell{white-space:normal;font-weight:600;cursor:pointer;color:var(--accent-dark);}
.summary-table td.name-cell:hover{text-decoration:underline;}
.summary-table-condensed{min-width:0;}
.status-mini-bar{width:100%;min-width:120px;max-width:220px;}
.status-mini-bar-track{display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--gray-bg);width:100%;}
.progress-cell{display:flex;align-items:center;gap:8px;min-width:140px;}
.progress-track{flex:1;height:7px;background:var(--gray-bg);border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:100px;}
.progress-pct{font-size:11.5px;font-weight:700;color:var(--text-2);min-width:34px;}
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--text-3);padding:10px 4px 0;}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.floating-hscroll{position:fixed;left:0;right:0;bottom:0;height:16px;overflow-x:auto;overflow-y:hidden;background:var(--surface);border-top:1px solid var(--border-strong);box-shadow:0 -2px 8px rgba(16,22,28,.06);z-index:60;}
.floating-hscroll-inner{height:1px;}
.gantt-legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:14px;}
.gantt-wrap{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
.gantt-labels{flex:none;width:170px;border-right:1px solid var(--border);background:var(--surface-2);}
.gantt-label-spacer{height:28px;border-bottom:1px solid var(--border);}
.gantt-row-label{height:34px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gantt-scroll{flex:1;overflow-x:auto;}
.gantt-inner{position:relative;}
.gantt-header{position:relative;border-bottom:1px solid var(--border);background:var(--surface-2);}
.gantt-month-line{position:absolute;top:0;bottom:0;width:1px;background:var(--border-strong);}
.gantt-month-label{position:absolute;top:7px;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;white-space:nowrap;}
.gantt-rows{position:relative;}
.gantt-row-track{height:34px;position:relative;border-bottom:1px solid var(--border);}
.gantt-bar{position:absolute;height:9px;border-radius:4px;}
.gantt-bar-test{top:5px;background:#90D5FF;}
.gantt-bar-prod{top:18px;background:#9EFF90;}
.gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:#C0281A;z-index:2;}
.tpl-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.tpl-title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.tpl-title-row h1{margin:0;}
.tpl-subnav{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);}
.tpl-subnav-btn{font-family:inherit;font-size:13px;font-weight:700;padding:9px 4px;margin-right:18px;background:none;border:none;border-bottom:2.5px solid transparent;color:var(--text-3);cursor:pointer;}
.tpl-subnav-btn:hover{color:var(--text-2);}
.tpl-subnav-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
.mapping-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;}
table.mapping-table{border-collapse:collapse;width:100%;font-size:12.5px;}
table.mapping-table th{position:sticky;top:0;background:#F8F9FB;z-index:1;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-2);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.mapping-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;white-space:pre-line;color:var(--text);}
table.mapping-table th:first-child, table.mapping-table td:first-child{width:220px;}
table.mapping-table th:nth-child(2), table.mapping-table td:nth-child(2){width:32%;}
table.mapping-table td.field-cell{font-weight:700;color:var(--text);white-space:nowrap;}
table.mapping-table tbody tr:nth-child(even){background:#FCFCFD;}
table.mapping-table tbody tr:hover{background:var(--accent-light);}
.editable-mapping-cell{cursor:text;transition:background .1s ease;}
.editable-mapping-cell:hover{background:var(--accent-light);}
.mapping-cell-edit{width:100%;font-family:inherit;font-size:12.5px;border:1px solid var(--accent);border-radius:6px;padding:6px 8px;outline:none;resize:vertical;min-height:34px;box-shadow:0 0 0 3px var(--accent-light);color:var(--text);background:#fff;}
.attach-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.attach-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--surface-2);}
.attach-card-title{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.attach-dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--border-strong);border-radius:8px;padding:28px 12px;cursor:pointer;background:#fff;text-align:center;transition:border-color .12s ease, background .12s ease;}
.attach-dropzone:hover{border-color:var(--accent);background:var(--accent-light);}
.attach-dropzone-icon{font-size:22px;color:var(--text-3);}
.attach-dropzone-text{font-size:12.5px;font-weight:600;color:var(--text-2);}
.attach-dropzone-hint{font-size:11px;font-weight:400;color:var(--text-3);}
.attach-preview{display:flex;align-items:center;justify-content:center;height:260px;border-radius:8px;background:#fff;border:1px solid var(--border);overflow:hidden;margin-bottom:10px;}
.attach-preview img{max-width:100%;max-height:260px;object-fit:contain;cursor:zoom-in;transition:opacity .12s ease;}
.attach-preview img:hover{opacity:0.9;}
.attach-file-icon{font-size:40px;}
.attach-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;margin-bottom:10px;}
.attach-filename{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;}
.attach-size{color:var(--text-3);white-space:nowrap;}
.attach-actions{display:flex;gap:8px;}
.attach-actions .btn{flex:1;justify-content:center;}
.btn-danger-outline{background:#fff;color:var(--red-tx);border-color:#F3C6C1;}
.btn-danger-outline:hover{background:var(--red-bg);}
.lightbox{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;}
.lightbox.hidden{display:none;}
.lightbox-backdrop{position:absolute;inset:0;background:rgba(10,14,20,.82);}
.lightbox-content{position:relative;z-index:1;width:92vw;height:88vh;max-width:1800px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.lightbox-content img{width:100%;height:calc(100% - 32px);object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff;}
.lightbox-caption{color:#E7EBF1;font-size:13px;font-weight:600;}
.lightbox-close{position:absolute;top:-40px;right:0;background:rgba(255,255,255,.12);color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s ease;}
.lightbox-close:hover{background:rgba(255,255,255,.24);}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#12161C;color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;z-index:100;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (max-width: 900px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand-mark">UC</div>
      <div class="brand-text"><span class="brand-title">UCC128 Label Rollout</span><span class="brand-sub">Testing &amp; Approval Tracker</span></div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost-dark btn-sm" id="fullscreen-btn" title="Toggle fullscreen">&#x26F6; Fullscreen</button>
      <label class="btn btn-ghost-dark btn-sm" for="importFile">Import data</label>
      <input type="file" id="importFile" accept="application/json" class="hidden">
      <button class="btn btn-accent btn-sm" onclick="exportData()">Export data</button>
    </div>
  </div>
  <div class="nav-row" id="navRow"></div>
  <div class="page hidden" id="pageDashboard"></div>
  <div class="page hidden" id="pageTracker"></div>
  <div class="page hidden" id="pageByCustomer"></div>
  <div class="page hidden" id="pageByTemplate"></div>
  <div class="page hidden" id="pageTemplateDetail"></div>
  <div class="page hidden" id="pageByWave"></div>
  <div class="floating-hscroll hidden" id="floatingHScroll"><div class="floating-hscroll-inner" id="floatingHScrollInner"></div></div>
</div>
<div id="toast"></div>
<div class="lightbox hidden" id="imageLightbox">
  <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script>
// Starter seed rows are no longer embedded: the live D1 database already holds all 331 rows.
// This array was only used to seed an EMPTY database via the "Load starter data" banner.

/* ---------------- API layer ---------------- */
async function apiGet(url){
  const res = await fetch(url);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('GET ' + url + ' failed: ' + res.status));
  return data;
}
async function apiPost(url, body){
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('POST ' + url + ' failed: ' + res.status));
  return data;
}
async function apiPatch(url, body){
  const res = await fetch(url, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('PATCH ' + url + ' failed: ' + res.status));
  return data;
}
async function apiPutFile(url, file){
  const res = await fetch(url, {method:'PUT', headers:{'Content-Type': file.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(file.name)}, body: file});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('PUT ' + url + ' failed: ' + res.status));
  return data;
}
async function apiDelete(url){
  const res = await fetch(url, {method:'DELETE'});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('DELETE ' + url + ' failed: ' + res.status));
  return data;
}

/* ---------------- helpers ---------------- */
function fmtDate(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${m}/${d}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function isValidDateStr(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.trim()); }
function templateHasBulkApproval(template){
  return records.some(r => r.template === template && r.status === 'Approved' && r.approvalScope === 'All Instances of Template');
}
function effectiveStatus(rec){
  if(rec.status === 'Approved') return 'Approved';
  if(templateHasBulkApproval(rec.template)) return 'Approved (via Template)';
  return rec.status || 'Not Started';
}
function isApprovedEffective(status){ return status === 'Approved' || status === 'Approved (via Template)'; }
function pillClass(status){
  switch(status){
    case 'Not Started': return 'pill-not-started';
    case 'Gathering Data': return 'pill-gathering';
    case 'Changes Requested': return 'pill-changes';
    case 'Approved': case 'Approved (via Template)': return 'pill-approved';
    default: return 'pill-not-started';
  }
}
function escapeHtml(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2400);
}
function uniqueSorted(field){ return [...new Set(records.map(r=>r[field]).filter(Boolean))].sort(); }

/* ---------------- wave-level dates ---------------- */
// A line's own date (rec.testStart etc.) is an OVERRIDE. Empty means "use the wave's date".
function waveDate(wave, field){ const w = waveDates[wave]; return (w && w[field]) || ''; }
function effDate(rec, field){ return rec[field] || waveDate(rec.wave, field); }
function isOverride(rec, field){ return !!rec[field] && !!waveDate(rec.wave, field); }
function hasAnyOverride(rec){ return DATE_FIELDS.some(f=>isOverride(rec, f)); }
function overrideCount(wave){ return records.filter(r=>r.wave===wave && hasAnyOverride(r)).length; }
function allWaves(){ return [...new Set([...records.map(r=>r.wave).filter(Boolean), ...Object.keys(waveDates)])].sort(); }
function dateConflict(rec, which){ // which: 'test' | 'prod' -> true when end is before start
  const s = effDate(rec, which+'Start'), e = effDate(rec, which+'End');
  return isValidDateStr(s) && isValidDateStr(e) && e < s;
}
async function loadWaveDates(){
  try{
    const list = await apiGet('/api/waves');
    waveDates = {};
    list.forEach(w=>{ waveDates[w.wave] = {testStart:w.testStart||'', testEnd:w.testEnd||'', prodStart:w.prodStart||'', prodEnd:w.prodEnd||''}; });
  }catch(err){ waveDates = {}; } // waves table not migrated yet: every line just shows its own dates, same as before
}
async function saveWaveDate(wave, field, value){
  if(!waveDates[wave]) waveDates[wave] = {testStart:'',testEnd:'',prodStart:'',prodEnd:''};
  const prev = waveDates[wave][field];
  waveDates[wave][field] = value || '';
  try{ await apiPatch('/api/waves', {wave, [field]: value || null}); return true; }
  catch(err){ waveDates[wave][field] = prev; showToast('Save failed: ' + err.message); return false; }
}

/* ---------------- nav ---------------- */
function renderNav(){
  const nav = document.getElementById('navRow');
  nav.innerHTML = TABS.map(t => `<div class="nav-tab ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  nav.querySelectorAll('.nav-tab').forEach(el=> el.addEventListener('click', ()=> switchTab(el.dataset.tab)));
}
function switchTab(tab, presetFilter){
  currentTab = tab;
  summarySearchTerm = '';
  templateDetailView = null;
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  const map = {dashboard:'pageDashboard', tracker:'pageTracker', byCustomer:'pageByCustomer', byTemplate:'pageByTemplate', byWave:'pageByWave'};
  document.getElementById(map[tab]).classList.remove('hidden');
  renderNav();
  if(tab==='dashboard') renderDashboard();
  if(tab==='tracker'){
    if(presetFilter) trackerFilters = {search:'', wave:'', template:'', status:'', customer:'', testingRequired:'', ...presetFilter};
    renderTracker();
  }
  if(tab==='byCustomer') renderSummary('customer','pageByCustomer','Customer','By Customer','Testing progress rolled up by customer account.');
  if(tab==='byTemplate') renderSummary('template','pageByTemplate','Template','By Template','Testing progress rolled up by UCC128 template.');
  if(tab==='byWave') renderWaveSummary();
  window.scrollTo(0,0);
  updateFloatingScrollVisibility();
}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const total = records.length;
  const required = records.filter(r=>r.testingRequired==='Yes').length;
  const effs = records.map(effectiveStatus);
  const approved = effs.filter(isApprovedEffective).length;
  const today = todayISO();
  const overdueRecs = records.filter(r=>{
    const eff = effectiveStatus(r);
    const te = effDate(r,'testEnd');
    return r.testingRequired==='Yes' && isValidDateStr(te) && te < today && !isApprovedEffective(eff);
  });
  const counts = {'Not Started':0,'Gathering Data':0,'Changes Requested':0,'Approved':0};
  effs.forEach(e=>{
    if(e==='Approved (via Template)') counts['Approved']++;
    else if(counts.hasOwnProperty(e)) counts[e]++;
    else counts['Not Started']++;
  });
  const statusRowsHtml = Object.entries(counts).map(([label,count])=>{
    const pct = total ? Math.round((count/total)*100) : 0;
    return `<div class="status-row"><span class="status-chip ${pillClass(label)}">${label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="status-count">${count} &middot; ${pct}%</span></div>`;
  }).join('');
  const overdueHtml = overdueRecs.length ? overdueRecs.slice(0,8).map(r=>`
    <div class="overdue-item"><div><div style="font-weight:600;">${escapeHtml(r.customer)}</div>
    <div class="overdue-meta">${escapeHtml(r.template)} &middot; ${escapeHtml(r.wave)}</div></div>
    <span class="pill ${pillClass(effectiveStatus(r))}">${effectiveStatus(r)}</span></div>`).join('') +
    (overdueRecs.length>8 ? `<div class="overdue-meta" style="padding-top:10px;">+ ${overdueRecs.length-8} more &mdash; see Testing Tracker</div>` : '')
    : `<div class="empty-state">No overdue combinations. Nice work.</div>`;

  document.getElementById('pageDashboard').innerHTML = `
    <h1 class="page-title">UCC128 Label Rollout &mdash; Testing Dashboard</h1>
    <p class="page-desc">Live overview of testing &amp; approval progress across all customer / template / go-live wave combinations.</p>
    <br />
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent-color:var(--accent)"><div class="kpi-label">Total Combos</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card" style="--accent-color:#7C6FE0"><div class="kpi-label">Testing Required</div><div class="kpi-value">${required}</div></div>
      <div class="kpi-card" style="--accent-color:var(--green-tx)"><div class="kpi-label">Approved</div><div class="kpi-value accent">${approved}</div></div>
      <div class="kpi-card" style="--accent-color:var(--red-tx)"><div class="kpi-label">Overdue</div><div class="kpi-value warn">${overdueRecs.length}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;">
      <div class="panel"><div class="panel-header"><span class="panel-title">Status Breakdown</span></div><div class="panel-body">${statusRowsHtml}</div></div>
      <div class="panel"><div class="panel-header"><span class="panel-title">Overdue Alerts</span><span class="result-count">${overdueRecs.length} combo${overdueRecs.length===1?'':'s'}</span></div><div class="panel-body">${overdueHtml}</div></div>
    </div>
    ${renderWaveCalendarHtml()}
  `;
}

function renderWaveCalendarHtml(){
  const waveMap = {};
  records.forEach(r=>{
    if(!r.wave) return;
    if(!waveMap[r.wave]) waveMap[r.wave] = {testStart:null,testEnd:null,prodStart:null,prodEnd:null};
    const w = waveMap[r.wave];
    const ts = isValidDateStr(effDate(r,'testStart')) ? effDate(r,'testStart') : null;
    const te = isValidDateStr(effDate(r,'testEnd')) ? effDate(r,'testEnd') : null;
    const ps = isValidDateStr(effDate(r,'prodStart')) ? effDate(r,'prodStart') : null;
    const pe = isValidDateStr(effDate(r,'prodEnd')) ? effDate(r,'prodEnd') : null;
    if(ts && (!w.testStart || ts < w.testStart)) w.testStart = ts;
    if(te && (!w.testEnd || te > w.testEnd)) w.testEnd = te;
    if(ps && (!w.prodStart || ps < w.prodStart)) w.prodStart = ps;
    if(pe && (!w.prodEnd || pe > w.prodEnd)) w.prodEnd = pe;
  });
  const waves = Object.keys(waveMap).sort();
  const allDates = [];
  waves.forEach(w=>{ const t = waveMap[w]; [t.testStart,t.testEnd,t.prodStart,t.prodEnd].forEach(d=>{ if(d) allDates.push(d); }); });
  const panelOpen = `<div class="panel"><div class="panel-header"><span class="panel-title">Testing &amp; Production Calendar</span></div><div class="panel-body">`;
  const panelClose = `</div></div>`;
  if(!allDates.length) return `${panelOpen}<div class="empty-state">No testing or production dates entered yet.</div>${panelClose}`;

  allDates.sort();
  const minDate = new Date(allDates[0]+'T00:00:00'); minDate.setDate(minDate.getDate()-2);
  const maxDate = new Date(allDates[allDates.length-1]+'T00:00:00'); maxDate.setDate(maxDate.getDate()+2);
  const totalDays = Math.max(1, Math.round((maxDate-minDate)/86400000));
  const pxPerDay = Math.max(9, Math.min(26, Math.floor(1000/totalDays)));
  const timelineWidth = totalDays*pxPerDay;
  const rowHeight = 34;
  function offsetOf(dateStr){ const d = new Date(dateStr+'T00:00:00'); return Math.round((d-minDate)/86400000)*pxPerDay; }

  let monthMarkers = '';
  let d = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  while(d <= maxDate){
    const offset = Math.round((d-minDate)/86400000)*pxPerDay;
    if(offset >= 0){
      monthMarkers += `<div class="gantt-month-line" style="left:${offset}px"></div><div class="gantt-month-label" style="left:${offset+4}px">${d.toLocaleString('en-US',{month:'short',year:'numeric'})}</div>`;
    }
    d = new Date(d.getFullYear(), d.getMonth()+1, 1);
  }
  const today = new Date(todayISO()+'T00:00:00');
  let todayLine = '';
  if(today >= minDate && today <= maxDate) todayLine = `<div class="gantt-today-line" style="left:${offsetOf(todayISO())}px" title="Today"></div>`;

  const labelsHtml = waves.map(w=>`<div class="gantt-row-label" title="${escapeHtml(w)}">${escapeHtml(w)}</div>`).join('');
  const tracksHtml = waves.map(w=>{
    const t = waveMap[w]; let testBar='', prodBar='';
    if(t.testStart && t.testEnd){
      const left = offsetOf(t.testStart); const width = Math.max(pxPerDay*0.6, offsetOf(t.testEnd)-left+pxPerDay);
      testBar = `<div class="gantt-bar gantt-bar-test" style="left:${left}px;width:${width}px" title="Testing Window: ${fmtDate(t.testStart)} \u2013 ${fmtDate(t.testEnd)}"></div>`;
    }
    if(t.prodStart && t.prodEnd){
      const left = offsetOf(t.prodStart); const width = Math.max(pxPerDay*0.6, offsetOf(t.prodEnd)-left+pxPerDay);
      prodBar = `<div class="gantt-bar gantt-bar-prod" style="left:${left}px;width:${width}px" title="Production Window: ${fmtDate(t.prodStart)} \u2013 ${fmtDate(t.prodEnd)}"></div>`;
    }
    return `<div class="gantt-row-track">${testBar}${prodBar}</div>`;
  }).join('');

  return `${panelOpen}
    <div class="gantt-legend">
      <span><span class="legend-dot" style="background:#90D5FF;border-radius:3px;"></span>Testing Window</span>
      <span><span class="legend-dot" style="background:#9EFF90;border-radius:3px;"></span>Production Window</span>
      <span><span class="legend-dot" style="background:#C0281A;width:2px;border-radius:0;height:12px;"></span>Today</span>
    </div>
    <div class="gantt-wrap">
      <div class="gantt-labels"><div class="gantt-label-spacer"></div>${labelsHtml}</div>
      <div class="gantt-scroll"><div class="gantt-inner" style="width:${timelineWidth}px">
        <div class="gantt-header" style="width:${timelineWidth}px;height:28px;">${monthMarkers}</div>
        <div class="gantt-rows" style="width:${timelineWidth}px;height:${waves.length*rowHeight}px;">${todayLine}${tracksHtml}</div>
      </div></div>
    </div>
  ${panelClose}`;
}

  {key:'notes', label:'Notes / Feedback', wide:true},
];

function getFilteredSortedRecords(){
  const f = trackerFilters;
  let list = records.filter(r=>{
    if(f.wave && r.wave!==f.wave) return false;
    if(f.template && r.template!==f.template) return false;
    if(f.customer && r.customer!==f.customer) return false;
    if(f.testingRequired){
      const val = f.testingRequired === '__BLANK__' ? '' : f.testingRequired;
      if((r.testingRequired||'') !== val) return false;
    }
    if(f.status){
      const eff = effectiveStatus(r);
      if(f.status==='Approved' ? !isApprovedEffective(eff) : eff!==f.status) return false;
    }
    if(f.search){
      const s = f.search.toLowerCase();
      if(!(r.account.toLowerCase().includes(s) || r.customer.toLowerCase().includes(s) || r.template.toLowerCase().includes(s))) return false;
    }
    return true;
  });
  const {key,dir} = trackerSort;
  list.sort((a,b)=>{
    let av = key==='effective' ? effectiveStatus(a) : DATE_FIELDS.includes(key) ? effDate(a,key) : (a[key]||'');
    let bv = key==='effective' ? effectiveStatus(b) : DATE_FIELDS.includes(key) ? effDate(b,key) : (b[key]||'');
    av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
    if(av<bv) return dir==='asc'?-1:1;
    if(av>bv) return dir==='asc'?1:-1;
    return 0;
  });
  return list;
}

// Computes the records matching every ACTIVE filter except the one named in
// `excludeKey` -- this is what lets each dropdown narrow to only the values
// that actually make sense given everything else currently selected (e.g.
// picking a Go-Live Wave narrows the Template dropdown to just the templates
// that exist within that wave), rather than every dropdown always showing
// every possible value regardless of context.
function getCascadedSubset(excludeKey){
  const f = trackerFilters;
  return records.filter(r=>{
    if(excludeKey!=='wave' && f.wave && r.wave!==f.wave) return false;
    if(excludeKey!=='template' && f.template && r.template!==f.template) return false;
    if(excludeKey!=='customer' && f.customer && r.customer!==f.customer) return false;
    if(excludeKey!=='testingRequired' && f.testingRequired){
      const val = f.testingRequired === '__BLANK__' ? '' : f.testingRequired;
      if((r.testingRequired||'') !== val) return false;
    }
    if(excludeKey!=='status' && f.status){
      const eff = effectiveStatus(r);
      if(f.status==='Approved' ? !isApprovedEffective(eff) : eff!==f.status) return false;
    }
    if(f.search){
      const s = f.search.toLowerCase();
      if(!(r.account.toLowerCase().includes(s) || r.customer.toLowerCase().includes(s) || r.template.toLowerCase().includes(s))) return false;
    }
    return true;
  });
}
function cascadedOptions(field, excludeKey){
  return [...new Set(getCascadedSubset(excludeKey).map(r=>r[field]).filter(Boolean))].sort();
}

function textCell(r, field){ return `<input class="cell-input" type="text" data-field="${field}" value="${escapeHtml(r[field])}">`; }
function resetBtnHtml(r, field){
  return `<button class="reset-wave-btn" data-reset="${field}" title="Reset to wave date (${fmtDate(waveDate(r.wave, field))})">&#8634;</button>`;
}
function dateCellTitle(r, field){
  if(isOverride(r, field)) return `Line override \u2014 wave date is ${fmtDate(waveDate(r.wave, field))}`;
  if(waveDate(r.wave, field)) return 'Inherited from go-live wave';
  return r[field] ? 'Line date (no wave date set)' : 'No date set for this wave';
}
function dateCell(r, field){
  const ovr = isOverride(r, field);
  const inherited = !r[field] && !!waveDate(r.wave, field);
  const conflict = dateConflict(r, field.startsWith('test') ? 'test' : 'prod');
  const cls = ['cell-date', ovr ? 'overridden' : '', inherited ? 'inherited' : '', conflict ? 'date-conflict' : ''].filter(Boolean).join(' ');
  return `<div class="date-cell-wrap"><input class="${cls}" type="date" data-field="${field}" value="${effDate(r, field)}" title="${escapeHtml(dateCellTitle(r, field))}">${ovr ? resetBtnHtml(r, field) : ''}</div>`;
}
function selectCell(r, field, options, allowBlank){
  const opts = allowBlank ? [''].concat(options.filter(o=>o!=='')) : options;
  return `<select class="cell-select" data-field="${field}">${opts.map(o=>`<option value="${escapeHtml(o)}" ${r[field]===o?'selected':''}>${o===''?'\u2014':escapeHtml(o)}</option>`).join('')}</select>`;
}
function waveCell(r){
  const waves = allWaves();
  const opts = waves.map(w=>`<option value="${escapeHtml(w)}" ${r.wave===w?'selected':''}>${escapeHtml(w)}</option>`).join('');
  return `<select class="cell-select" data-field="wave">${opts}<option value="__new_wave__">+ Create new wave&hellip;</option></select>`;
}

function renderTracker(){
  const prevWrap = document.querySelector('#pageTracker .table-wrap');
  const savedScrollLeft = prevWrap ? prevWrap.scrollLeft : 0;

  const waves = cascadedOptions('wave', 'wave');
  const templates = cascadedOptions('template', 'template');
  const testingRequiredSubset = getCascadedSubset('testingRequired');
  const hasYes = testingRequiredSubset.some(r=>r.testingRequired==='Yes');
  const hasNo = testingRequiredSubset.some(r=>r.testingRequired==='No');
  const hasBlank = testingRequiredSubset.some(r=>!r.testingRequired);
  const filtered = getFilteredSortedRecords();

  const headHtml = TRACKER_COLUMNS.map(c=>{
    const sorted = trackerSort.key===c.key;
    const arrow = sorted ? (trackerSort.dir==='asc'?'&uarr;':'&darr;') : '&uarr;';
    const groupCls = c.group ? 'col-group-start' : '';
    return `<th class="${sorted?'sorted':''} ${groupCls}" data-sortkey="${c.sort||c.computed?c.key:''}" style="${c.wide?'min-width:220px':''}">${c.label}${(c.sort||c.computed)?`<span style="opacity:.4;margin-left:3px;">${arrow}</span>`:''}</th>`;
  }).join('');

  const bodyHtml = filtered.map(r=>{
    const eff = effectiveStatus(r);
    const approvedClass = isApprovedEffective(eff) ? 'row-approved' : '';
    return `<tr data-id="${r.id}" class="${approvedClass}">
      <td>${escapeHtml(r.account)}</td>
      <td style="font-weight:600;">${escapeHtml(r.customer)}</td>
      <td class="editable-col ${r.wave==='UNKNOWN'?'wave-unknown':''}">${waveCell(r)}</td>
      <td>${escapeHtml(r.template)}</td>
      <td class="editable-col col-group-start">${dateCell(r,'testStart')}</td>
      <td class="editable-col">${dateCell(r,'testEnd')}</td>
      <td class="editable-col col-group-start">${dateCell(r,'prodStart')}</td>
      <td class="editable-col">${dateCell(r,'prodEnd')}</td>
      <td class="editable-col">${selectCell(r,'testingRequired',YN_OPTIONS,true)}</td>
      <td class="editable-col">${textCell(r,'testResource')}</td>
      <td class="editable-col">${textCell(r,'inventoryResource')}</td>
      <td class="editable-col">${textCell(r,'opsReviewer')}</td>
      <td class="editable-col">${selectCell(r,'status',STATUS_OPTIONS,false)}</td>
      <td class="editable-col">${selectCell(r,'approvalScope',SCOPE_OPTIONS,false)}</td>
      <td class="editable-col">${textCell(r,'testPOs')}</td>
      <td class="editable-col">${textCell(r,'notes')}</td>
    </tr>`;
  }).join('');

  const chips = [];
  if(trackerFilters.search) chips.push({k:'search', label:`Search: "${trackerFilters.search}"`});
  if(trackerFilters.wave) chips.push({k:'wave', label:`Wave: ${trackerFilters.wave}`});
  if(trackerFilters.template) chips.push({k:'template', label:`Template: ${trackerFilters.template}`});
  if(trackerFilters.testingRequired) chips.push({k:'testingRequired', label:`Testing Req.: ${trackerFilters.testingRequired==='__BLANK__'?'Not Set':trackerFilters.testingRequired}`});
  if(trackerFilters.status) chips.push({k:'status', label:`Status: ${trackerFilters.status}`});
  if(trackerFilters.customer) chips.push({k:'customer', label:`Customer: ${trackerFilters.customer}`});
  const chipsHtml = chips.map(c=>`<span class="chip">${escapeHtml(c.label)}<button class="chip-x" data-k="${c.k}">&times;</button></span>`).join('');

  document.getElementById('pageTracker').innerHTML = `
    <h1 class="page-title">Testing Tracker</h1>
    <p class="page-desc">${records.length} customer / template / go-live wave combinations. Edit any highlighted field directly.</p>
    <div class="toolbar">
      <input class="tf-input tf-search" id="f-search" placeholder="Search account, customer, or template&hellip;" value="${escapeHtml(trackerFilters.search)}">
      <select class="tf-select" id="f-wave"><option value="">All Go-Live Waves</option>${waves.map(w=>`<option value="${escapeHtml(w)}" ${trackerFilters.wave===w?'selected':''}>${escapeHtml(w)}</option>`).join('')}</select>
      <select class="tf-select" id="f-template"><option value="">All Templates</option>${templates.map(t=>`<option value="${escapeHtml(t)}" ${trackerFilters.template===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>
      <select class="tf-select" id="f-testing-required">
        <option value="">All (Testing Req.)</option>
        ${hasYes ? `<option value="Yes" ${trackerFilters.testingRequired==='Yes'?'selected':''}>Yes</option>` : ''}
        ${hasNo ? `<option value="No" ${trackerFilters.testingRequired==='No'?'selected':''}>No</option>` : ''}
        ${hasBlank ? `<option value="__BLANK__" ${trackerFilters.testingRequired==='__BLANK__'?'selected':''}>Not Set</option>` : ''}
      </select>
      <select class="tf-select" id="f-status"><option value="">All Statuses</option>${STATUS_OPTIONS.map(s=>`<option value="${s}" ${trackerFilters.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <button class="btn btn-outline btn-sm" id="f-clear" ${chips.length?'':'disabled'}>Clear all filters</button>
      <div class="toolbar-spacer"></div>
      <button class="btn btn-accent btn-sm" id="copy-email-btn">Copy for Email</button>
      <span class="result-count">${filtered.length} of ${records.length} combos</span>
    </div>
    ${chips.length ? `<div class="chips-row">${chipsHtml}</div>` : ''}
    ${trackerFilters.wave ? waveDatesStripHtml(trackerFilters.wave) : ''}
    <div class="table-wrap"><table><thead><tr>${headHtml}</tr></thead>
      <tbody>${bodyHtml || `<tr><td colspan="${TRACKER_COLUMNS.length}" class="empty-state">No combinations match these filters.</td></tr>`}</tbody>
    </table></div>
    <div class="legend">
      <span><span class="legend-dot" style="background:var(--accent-light);border:1px solid var(--accent)"></span>Editable field</span>
      <span><span class="legend-dot" style="background:#E8F8EC;border:1px solid var(--green-tx)"></span>Row is Approved</span>
      <span><span class="legend-dot" style="background:#F3EEFF;border:1px solid #6D28D9"></span>Date overrides the wave (&#8634; resets it)</span>
      <span><span class="legend-dot" style="background:var(--red-bg);border:1px solid var(--red-tx)"></span>End date is before start date</span>
      <span>Grey dates are inherited from the go-live wave</span>
      <span>Setting Status to Approved with Approval Scope "All Instances of Template" approves every row sharing that template</span>
    </div>
  `;
  bindTrackerEvents();

  if(savedScrollLeft){
    const newWrap = document.querySelector('#pageTracker .table-wrap');
    if(newWrap) newWrap.scrollLeft = savedScrollLeft;
    document.getElementById('floatingHScroll').scrollLeft = savedScrollLeft;
  }
}

function bindTrackerEvents(){
  const page = document.getElementById('pageTracker');
  page.querySelector('#f-search').addEventListener('input', e=>{ trackerFilters.search = e.target.value; renderTracker(); });
  page.querySelector('#f-wave').addEventListener('change', e=>{ trackerFilters.wave = e.target.value; renderTracker(); });
  page.querySelector('#f-template').addEventListener('change', e=>{ trackerFilters.template = e.target.value; renderTracker(); });
  page.querySelector('#f-testing-required').addEventListener('change', e=>{ trackerFilters.testingRequired = e.target.value; renderTracker(); });
  page.querySelector('#f-status').addEventListener('change', e=>{ trackerFilters.status = e.target.value; renderTracker(); });
  page.querySelector('#f-clear').addEventListener('click', ()=>{ trackerFilters = {search:'',wave:'',template:'',status:'',customer:'',testingRequired:''}; renderTracker(); });
  page.querySelector('#copy-email-btn').addEventListener('click', copyFilteredViewForEmail);
  page.querySelectorAll('.chip-x').forEach(btn=> btn.addEventListener('click', ()=>{ trackerFilters[btn.dataset.k] = ''; renderTracker(); }));
  page.querySelectorAll('thead th[data-sortkey]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sortkey; if(!key) return;
      if(trackerSort.key===key) trackerSort.dir = trackerSort.dir==='asc'?'desc':'asc';
      else trackerSort = {key, dir:'asc'};
      renderTracker();
    });
  });

  bindWaveDateInputs(page, renderTracker);
  page.querySelector('tbody').addEventListener('click', async e=>{
    const btn = e.target.closest('[data-reset]'); if(!btn) return;
    const tr = btn.closest('tr'); const rec = records.find(r=>r.id===tr.dataset.id); if(!rec) return;
    const field = btn.dataset.reset; const prev = rec[field];
    rec[field] = '';
    refreshDateCells(tr, rec);
    try{ await apiPatch(`/api/rows/${rec.id}`, {[field]: ''}); }
    catch(err){ rec[field] = prev; refreshDateCells(tr, rec); showToast('Save failed \u2014 check your connection'); }
  });
  page.querySelector('tbody').addEventListener('change', async e=>{
    const field = e.target.dataset.field; if(!field) return;
    const tr = e.target.closest('tr'); const id = tr.dataset.id;
    const rec = records.find(r=>r.id===id); if(!rec) return;

    if(field==='status' || field==='approvalScope'){
      const wasBulk = rec.status==='Approved' && rec.approvalScope==='All Instances of Template';
      rec[field] = e.target.value;
      const isBulk = rec.status==='Approved' && rec.approvalScope==='All Instances of Template';
      let toSave = [];
      if(isBulk && !wasBulk){
        records.filter(r=>r.template===rec.template).forEach(r=>{ r.status='Approved'; r.approvalScope='All Instances of Template'; toSave.push(r); });
      } else if(!isBulk && wasBulk){
        toSave.push(rec);
        records.filter(r=>r.template===rec.template && r.id!==rec.id && r.status==='Approved' && r.approvalScope==='All Instances of Template')
          .forEach(r=>{ r.status='Not Started'; r.approvalScope='This Combo Only'; toSave.push(r); });
      } else {
        toSave.push(rec);
      }
      renderTracker();
      try{
        await Promise.all(toSave.map(r => apiPatch(`/api/rows/${r.id}`, {status:r.status, approvalScope:r.approvalScope})));
        if(toSave.length>1) showToast(`Applied to ${toSave.length} rows sharing this template`);
      }catch(err){ showToast('Save failed \u2014 check your connection and try again'); }
      return;
    }

    if(field==='wave'){
      let newWave = e.target.value;
      if(newWave === '__new_wave__'){
        const entered = prompt('Enter the new go-live wave name:', '');
        if(entered && entered.trim()) newWave = entered.trim();
        else { renderTracker(); return; }
      }
      rec.wave = newWave;
      renderTracker();
      try{ await apiPatch(`/api/rows/${rec.id}`, {wave:newWave}); }
      catch(err){ showToast('Save failed \u2014 check your connection'); }
      return;
    }

    if(field==='testingRequired'){
      rec[field] = e.target.value;
      renderTracker(); // refresh so the Testing Req. filter dropdown reflects this change immediately
      try{ await apiPatch(`/api/rows/${rec.id}`, {testingRequired: rec.testingRequired}); }
      catch(err){ showToast('Save failed \u2014 check your connection'); }
      return;
    }

    if(DATE_FIELDS.includes(field)){
      const val = e.target.value;
      // Clearing the cell, or picking the wave's own date, means "follow the wave". Anything else is a line override.
      const newVal = (!val || val === waveDate(rec.wave, field)) ? '' : val;
      const prev = rec[field];
      rec[field] = newVal;
      refreshDateCells(tr, rec);
      try{ await apiPatch(`/api/rows/${rec.id}`, {[field]: newVal}); }
      catch(err){ rec[field] = prev; refreshDateCells(tr, rec); showToast('Save failed \u2014 check your connection'); }
      return;
    }
    rec[field] = e.target.value;
    try{ await apiPatch(`/api/rows/${rec.id}`, {[field]: rec[field]}); }
    catch(err){ showToast('Save failed \u2014 check your connection'); }
  });

  bindFloatingScroll(page);
}

/* ---------------- summary / pivot views ---------------- */
function statusBreakdownBarHtml(notStarted, gathering, changes, approved, total){
  if(!total) return '<span style="color:var(--text-3);font-size:12px;">&mdash;</span>';
  const segs = [
    {n:notStarted, color:'var(--gray-tx)', label:'Not Started'},
    {n:gathering, color:'var(--amber-tx)', label:'Gathering Data'},
    {n:changes, color:'var(--red-tx)', label:'Changes Requested'},
    {n:approved, color:'var(--green-tx)', label:'Approved'},
  ];
  const titleText = segs.map(s=>`${s.label}: ${s.n}`).join(' \u2022 ');
  const bars = segs.filter(s=>s.n>0).map(s=>`<div style="width:${(s.n/total*100).toFixed(1)}%;background:${s.color};height:100%;"></div>`).join('');
  return `<div class="status-mini-bar" title="${escapeHtml(titleText)}"><div class="status-mini-bar-track">${bars}</div></div>`;
}

function attachmentIndicatorHtml(hasFile){
  return hasFile ? '<span class="pill pill-approved">&#10003; Uploaded</span>' : '<span class="pill pill-not-started">No file</span>';
}

function renderSummary(field, pageId, keyLabel, title, desc){
  const showSearch = field === 'template';
  const condensed = field === 'template';
  const allKeys = uniqueSorted(field);
  const term = showSearch ? summarySearchTerm.trim().toLowerCase() : '';
  const keys = term ? allKeys.filter(k=>k.toLowerCase().includes(term)) : allKeys;

  const rowsHtml = keys.map(key=>{
    const subset = records.filter(r=>r[field]===key);
    const total = subset.length;
    const required = subset.filter(r=>r.testingRequired==='Yes').length;
    const effs = subset.map(effectiveStatus);
    const notStarted = effs.filter(e=>e==='Not Started').length;
    const gathering = effs.filter(e=>e==='Gathering Data').length;
    const changes = effs.filter(e=>e==='Changes Requested').length;
    const approved = effs.filter(isApprovedEffective).length;
    const pct = total ? Math.round((approved/total)*100) : 0;
    if(condensed){
      const hasMovex = sampleKeys.has('movex/'+key);
      const hasIntraone = sampleKeys.has('intraone/'+key);
      return `<tr data-key="${escapeHtml(key)}"><td class="name-cell">${escapeHtml(key)}</td><td>${total}</td><td>${required}</td>
        <td>${statusBreakdownBarHtml(notStarted, gathering, changes, approved, total)}</td>
        <td><div class="progress-cell"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-pct">${pct}%</span></div></td>
        <td>${attachmentIndicatorHtml(hasMovex)}</td>
        <td>${attachmentIndicatorHtml(hasIntraone)}</td></tr>`;
    }
    return `<tr data-key="${escapeHtml(key)}"><td class="name-cell">${escapeHtml(key)}</td><td>${total}</td><td>${required}</td>
      <td>${notStarted}</td><td>${gathering}</td><td>${changes}</td><td>${approved}</td>
      <td><div class="progress-cell"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-pct">${pct}%</span></div></td></tr>`;
  }).join('');

  const headHtml = condensed
    ? `<th>${keyLabel}</th><th>Total Combos</th><th>Testing Req.</th><th>Status Breakdown</th><th>% Approved</th><th>MovEx Sample</th><th>IntraOne Sample</th>`
    : `<th>${keyLabel}</th><th>Total Combos</th><th>Testing Req.</th><th>Not Started</th><th>Gathering Data</th><th>Changes Req.</th><th>Approved</th><th>% Approved</th>`;
  const colspan = condensed ? 7 : 8;

  document.getElementById(pageId).innerHTML = `
    <h1 class="page-title">${title}</h1>
    <p class="page-desc">${desc} ${condensed ? 'Click a template to open its detail page.' : 'Click a row to view its combinations in the Testing Tracker.'}</p>
    ${showSearch ? `<div class="toolbar" style="margin-bottom:14px;">
      <input class="tf-input tf-search" id="summary-search" placeholder="Search templates&hellip;" value="${escapeHtml(summarySearchTerm)}">
      <div class="toolbar-spacer"></div><span class="result-count">${keys.length} of ${allKeys.length} templates</span></div>` : ''}
    <div class="table-wrap"><table class="summary-table ${condensed?'summary-table-condensed':''}"><thead><tr>${headHtml}</tr></thead>
      <tbody>${rowsHtml || `<tr><td colspan="${colspan}" class="empty-state">${term?'No templates match your search.':'No data.'}</td></tr>`}</tbody>
    </table></div>`;

  if(showSearch){
    const input = document.getElementById('summary-search');
    input.addEventListener('input', e=>{
      summarySearchTerm = e.target.value;
      renderSummary(field, pageId, keyLabel, title, desc);
      const el = document.getElementById('summary-search');
      el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    });
  }
  document.getElementById(pageId).querySelectorAll('tbody tr[data-key]').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      if(field === 'template') openTemplateDetail(tr.dataset.key);
      else switchTab('tracker', {[field]: tr.dataset.key});
    });
  });
}

/* ---------------- wave date editing ---------------- */
// Updates one row's date cells without re-rendering, so a date picker being typed into keeps focus.
function refreshDateCells(tr, rec){
  DATE_FIELDS.forEach(f=>{
    const inp = tr.querySelector(`input[data-field="${f}"]`); if(!inp) return;
    const ovr = isOverride(rec, f);
    inp.classList.toggle('overridden', ovr);
    inp.classList.toggle('inherited', !rec[f] && !!waveDate(rec.wave, f));
    inp.classList.toggle('date-conflict', dateConflict(rec, f.startsWith('test') ? 'test' : 'prod'));
    inp.title = dateCellTitle(rec, f);
    if(document.activeElement !== inp) inp.value = effDate(rec, f);
    const wrap = inp.parentElement; const btn = wrap.querySelector('.reset-wave-btn');
    if(ovr && !btn) wrap.insertAdjacentHTML('beforeend', resetBtnHtml(rec, f));
    else if(!ovr && btn) btn.remove();
  });
}

function waveDatesStripHtml(wave){
  const labels = {testStart:'Test Start', testEnd:'Test End', prodStart:'Prod Start', prodEnd:'Prod End'};
  const n = overrideCount(wave);
  return `<div class="wave-dates-strip" data-wave="${escapeHtml(wave)}">
    <strong style="font-size:13px;">Wave dates</strong>
    ${DATE_FIELDS.map(f=>`<label>${labels[f]} <input type="date" class="wave-date-input" data-wave-field="${f}" value="${waveDate(wave,f)}"></label>`).join('')}
    <span class="ovr-count">${n ? `${n} line${n===1?'':'s'} with overrides` : 'No line overrides'}</span>
    ${n ? `<button class="btn btn-outline btn-sm" data-clear-overrides="1">Reset all lines to wave dates</button>` : ''}
  </div>`;
}

function bindWaveDateInputs(root, rerender){
  root.querySelectorAll('[data-wave-field]').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', async e=>{
      e.stopPropagation();
      const wave = inp.closest('[data-wave]').dataset.wave;
      const field = inp.dataset.waveField;
      const ok = await saveWaveDate(wave, field, inp.value);
      if(ok){
        const following = records.filter(r=>r.wave===wave && !r[field]).length;
        showToast(`Wave date saved \u2014 ${following} line${following===1?'':'s'} follow it`);
      }
      rerender();
    });
  });
  root.querySelectorAll('[data-clear-overrides]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      e.stopPropagation();
      const wave = btn.closest('[data-wave]').dataset.wave;
      const targets = records.filter(r=>r.wave===wave && hasAnyOverride(r));
      if(!targets.length) return;
      if(!confirm(`Clear date overrides on ${targets.length} line${targets.length===1?'':'s'} in "${wave}"? They will follow the wave dates.`)) return;
      let failed = 0;
      await Promise.all(targets.map(async r=>{
        const patch = {}; DATE_FIELDS.forEach(f=>{ if(isOverride(r, f)) patch[f] = ''; });
        try{ await apiPatch(`/api/rows/${r.id}`, patch); Object.keys(patch).forEach(f=>{ r[f] = ''; }); }
        catch(err){ failed++; }
      }));
      showToast(failed ? `${failed} line${failed===1?'':'s'} failed to reset \u2014 try again` : `Reset ${targets.length} line${targets.length===1?'':'s'} to wave dates`);
      rerender();
    });
  });
}

function renderWaveSummary(){

function renderAttachmentCard(template, type, label){
  const el = document.getElementById(`attach-${type}`);
  if(!el) return;
  const key = `${type}/${template}`;
  const hasFile = sampleKeys.has(key);
  const apiUrl = `/api/samples/${type}/${encodeURIComponent(template)}`;

  if(hasFile){
    el.innerHTML = `
      <div class="attach-card-title">${escapeHtml(label)} Label Sample</div>
      <div class="attach-preview"><img src="${apiUrl}?t=${Date.now()}" alt="${escapeHtml(label)} sample"></div>
      <div class="attach-meta">
        <span class="attach-filename" id="filename-${type}">&hellip;</span>
        <span class="attach-size" id="size-${type}"></span>
      </div>
      <div class="attach-actions">
        <label class="btn btn-outline btn-sm" for="file-${type}">Replace</label>
        <button class="btn btn-danger-outline btn-sm" id="remove-${type}">Remove</button>
      </div>
      <input type="file" id="file-${type}" class="hidden" accept="image/*,application/pdf">
    `;
    fetch(apiUrl).then(r=>{
      const size = r.headers.get('Content-Length');
      const filename = r.headers.get('X-Filename');
      if(filename) document.getElementById(`filename-${type}`).textContent = decodeURIComponent(filename);
      if(size) document.getElementById(`size-${type}`).textContent = formatBytes(Number(size));
    }).catch(()=>{});

    const img = el.querySelector('.attach-preview img');
    if(img) img.addEventListener('click', ()=> openImageLightbox(apiUrl, `${label} \u2014 ${template}`));
    document.getElementById(`remove-${type}`).addEventListener('click', async ()=>{
      if(!confirm(`Remove the ${label} label sample for ${template}?`)) return;
      try{
        await apiDelete(apiUrl);
        sampleKeys.delete(key);
        renderAttachmentCard(template, type, label);
        showToast(`${label} label sample removed`);
      }catch(err){ showToast('Remove failed: ' + err.message); }
    });
  } else {
    el.innerHTML = `
      <div class="attach-card-title">${escapeHtml(label)} Label Sample</div>
      <label class="attach-dropzone" for="file-${type}">
        <div class="attach-dropzone-icon">&#8593;</div>
        <div class="attach-dropzone-text">Click to upload<br><span class="attach-dropzone-hint">PNG, JPG, or PDF &middot; up to 4MB</span></div>
      </label>
      <input type="file" id="file-${type}" class="hidden" accept="image/*,application/pdf">
    `;
  }

  document.getElementById(`file-${type}`).addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 4*1024*1024){ showToast('File too large \u2014 please keep label samples under 4MB'); e.target.value=''; return; }
    try{
      await apiPutFile(apiUrl, file);
      sampleKeys.add(key);
      renderAttachmentCard(template, type, label);
      showToast(`${label} label sample uploaded`);
    }catch(err){ showToast('Upload failed: ' + err.message); }
  });
}
function formatBytes(bytes){
  if(!bytes && bytes!==0) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function startEditingMappingCell(td){
  if(td.querySelector('textarea')) return;
  const id = Number(td.dataset.id);
  const col = td.dataset.col;
  const mapping = labelMappingData.mappings.find(m=>m.id===id);
  if(!mapping) return;
  const raw = mapping[col] || '';
  const originalHtml = td.innerHTML;

  const textarea = document.createElement('textarea');
  textarea.className = 'mapping-cell-edit';
  textarea.value = raw;
  textarea.rows = Math.max(1, raw.split('\n').length);
  td.innerHTML = '';
  td.appendChild(textarea);
  textarea.focus();
  textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  textarea.addEventListener('click', e => e.stopPropagation());

  async function commit(){
    const newVal = textarea.value;
    const prevVal = mapping[col];
    mapping[col] = newVal;
    td.innerHTML = col==='fieldName' ? escapeHtml(newVal) : escapeHtml(newVal).replace(/\n/g,'<br>');
    try{
      await apiPatch(`/api/mappings/${id}`, {[col]: newVal});
    }catch(err){
      mapping[col] = prevVal;
      showToast('Save failed: ' + err.message);
    }
  }
  function cancel(){ td.innerHTML = originalHtml; }

  textarea.addEventListener('blur', commit);
  textarea.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){ e.preventDefault(); textarea.removeEventListener('blur', commit); cancel(); }
    else if(e.key === 'Enter' && !e.shiftKey && col === 'fieldName'){ e.preventDefault(); textarea.blur(); }
  });
}

const EMAIL_COLUMNS = [

  {label:'Template', get:r=>r.template}, {label:'Test Start', get:r=>fmtDate(effDate(r,'testStart'))}, {label:'Test End', get:r=>fmtDate(effDate(r,'testEnd'))},

function describeActiveFilters(){

function buildEmailHtml(rows){
  const tdStyle = 'border:1px solid #D9DEE5;padding:6px 9px;font-size:12px;font-family:Arial,Helvetica,sans-serif;color:#12161C;';
  const thStyle = tdStyle + 'background:#F1F3F6;font-weight:bold;text-align:left;';
  const meta = `${rows.length} combination${rows.length===1?'':'s'} &middot; Filters: ${escapeHtml(describeActiveFilters())} &middot; Exported ${escapeHtml(fmtDate(todayISO()))}`;
  const headRow = '<tr>' + EMAIL_COLUMNS.map(c=>`<th style="${thStyle}">${escapeHtml(c.label)}</th>`).join('') + '</tr>';
  const bodyRows = rows.map(r=>'<tr>' + EMAIL_COLUMNS.map(c=>`<td style="${tdStyle}">${escapeHtml(c.get(r)||'')}</td>`).join('') + '</tr>').join('');
  return `<div style="font-family:Arial,Helvetica,sans-serif;"><div style="font-size:15px;font-weight:bold;color:#12161C;margin-bottom:2px;">UCC128 Label Rollout &mdash; Testing Tracker</div>
    <div style="font-size:12px;color:#5B6472;margin-bottom:10px;">${meta}</div>
    <table style="border-collapse:collapse;"><thead>${headRow}</thead><tbody>${bodyRows}</tbody></table></div>`;
}
function buildEmailPlainText(rows){
  const lines = ['UCC128 Label Rollout \u2014 Testing Tracker',
    `${rows.length} combination${rows.length===1?'':'s'} | Filters: ${describeActiveFilters()} | Exported ${fmtDate(todayISO())}`, '',
    EMAIL_COLUMNS.map(c=>c.label).join('\t')];
  rows.forEach(r=> lines.push(EMAIL_COLUMNS.map(c=>c.get(r)||'').join('\t')));
  return lines.join('\n');

function legacyCopyHtml(html){
  const container = document.createElement('div');
  container.style.position='fixed'; container.style.left='-9999px'; container.style.top='0';
  container.setAttribute('contenteditable','true'); container.innerHTML = html;
  document.body.appendChild(container);
  const range = document.createRange(); range.selectNodeContents(container);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  let success = false;
  try{ success = document.execCommand('copy'); }catch(err){ success = false; }
  sel.removeAllRanges(); document.body.removeChild(container);
  return success;
}
async function copyFilteredViewForEmail(){
  const rows = getFilteredSortedRecords();
  if(!rows.length){ showToast('No rows to copy \u2014 adjust your filters'); return; }
  const html = buildEmailHtml(rows), text = buildEmailPlainText(rows);
  let done=false, mode='';
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type:'text/html'}), 'text/plain': new Blob([text], {type:'text/plain'})})]);
      done=true; mode='rich';
    }
  }catch(err){ done=false; }
  if(!done){ try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); done=true; mode='text'; } }catch(err){ done=false; } }
  if(!done){ done = legacyCopyHtml(html); if(done) mode='rich'; }
  showToast(done ? (mode==='rich' ? `Copied ${rows.length} rows \u2014 paste into your email` : `Copied ${rows.length} rows as plain text`) : 'Copy failed \u2014 your browser is blocking clipboard access');
}

/* Import (writes changes back to the live database) */
document.getElementById('importFile').addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file) return;
  let parsed;
  try{
    const text = await file.text();
    parsed = JSON.parse(text);
  }catch(err){
    alert('Could not read that file. Please choose a JSON export from this tracker.');
    e.target.value = '';
    return;
  }
  if(!Array.isArray(parsed)){
    alert("That file doesn't look like a tracker export (expected a JSON array of rows).");
    e.target.value = '';
    return;
  }
  try{
    const result = await apiPost('/api/rows/bulk-update', parsed);
    records = await apiGet('/api/rows');
    switchTab(currentTab);
    if(result.updated < result.attempted){
      showToast(`Imported ${result.updated} of ${result.attempted} rows \u2014 some didn't match an existing account + template`);
    } else {
      showToast(`Imported ${result.updated} row${result.updated===1?'':'s'}`);
    }
  }catch(err){
    showToast('Import failed: ' + (err.message || 'unknown error'));
  }
  e.target.value = '';
});

/* Fullscreen */
(function(){
  const btn = document.getElementById('fullscreen-btn'); const docEl = document.documentElement;
  function requestFs(el){ const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen; if(!fn) return Promise.reject(new Error('unavailable')); return fn.call(el); }
  function exitFs(){ const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen; if(!fn) return Promise.reject(new Error('unavailable')); return fn.call(document); }
  function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement); }
  function updateButton(){ btn.innerHTML = isFullscreen() ? '&#x2715; Exit Fullscreen' : '&#x26F6; Fullscreen'; }
  btn.addEventListener('click', async ()=>{
    try{ if(!isFullscreen()) await requestFs(docEl); else await exitFs(); }
    catch(err){ showToast('Fullscreen isn\u2019t available in this view'); }
  });
  ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(evt=> document.addEventListener(evt, updateButton));
  updateButton();
})();

/* ---------------- init / bootstrap ---------------- */
async function loadSampleKeys(){
  try{
    const list = await apiGet('/api/samples');
    sampleKeys = new Set(list.map(s => s.key));
  }catch(err){
    sampleKeys = new Set(); // non-fatal: attachment indicators just show "No file" until this succeeds
  }
}
async function loadLabelMappings(){
  try{
    labelMappingData.mappings = await apiGet('/api/mappings');
  }catch(err){
    labelMappingData.mappings = [];
  }
}

async function init(){
  renderNav();
  document.getElementById('pageDashboard').innerHTML = '<div class="empty-state">Loading tracker data&hellip;</div>';
  document.getElementById('pageDashboard').classList.remove('hidden');
  try{
    records = await apiGet('/api/rows');
  }catch(err){
    document.getElementById('pageDashboard').innerHTML = `<div class="banner"><span>Could not load data from the API. Check that your D1 database and bindings are set up correctly (see GRANULAR_SETUP_GUIDE.md).</span></div>`;
    return;
  }

  if(records.length === 0){
    document.getElementById('pageDashboard').innerHTML = `
      <div class="banner">
        <span><strong>No data found.</strong> Load the ${STARTER_DATA.length} starter rows and ${MAPPING_STARTER.length} label mapping fields into your database once, and the tracker will use them from here on.</span>
        <button class="btn btn-accent btn-sm" id="load-starter-btn">Load starter data</button>
      </div>`;
    document.getElementById('load-starter-btn').addEventListener('click', async function(){
      const btn = this; btn.disabled = true; btn.textContent = 'Loading\u2026';
      try{
        await apiPost('/api/bootstrap', STARTER_DATA);
        try{ await apiPost('/api/mappings/bootstrap', MAPPING_STARTER); }catch(err){ /* non-fatal, e.g. already loaded */ }
        records = await apiGet('/api/rows');
        await loadSampleKeys();
        await loadLabelMappings();
        switchTab('dashboard');
        showToast(`Loaded ${records.length} rows`);
      }catch(err){
        showToast('Failed to load starter data \u2014 check console for details');
        btn.disabled = false; btn.textContent = 'Retry';
      }
    });
    return;
  }
  await loadSampleKeys();
  await loadLabelMappings();
  await loadWaveDates();
  switchTab('dashboard');
}
init();
</script>
